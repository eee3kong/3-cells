name: buildwatch
description: BuildWatch Neighbourhood Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_analytics: ^10.7.0
  firebase_database: ^10.3.0
  syncfusion_flutter_gauges: ^21.2.4
  flutter_map: ^6.1.0        # Leaflet for Flutter
  latlong2: ^0.9.0           # Coordinates math
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/map.jpg
    - assets/logo.png